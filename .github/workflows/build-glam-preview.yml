name: Build Glam Room preview

on:
  push:
    branches:
      - the-glam-room-v2
    paths:
      - '.glam-deploy/**'
      - '.github/workflows/build-glam-preview.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: the-glam-room-v2
          fetch-depth: 0

      - name: Rebuild preview from uploaded ZIP
        shell: bash
        run: |
          set -euo pipefail

          cat .glam-deploy/part-*.txt > /tmp/site.zip.b64
          base64 -d /tmp/site.zip.b64 > /tmp/site.zip
          echo "$(cat .glam-deploy/sha256.txt)  /tmp/site.zip" | sha256sum -c -

          rm -rf /tmp/site-unpack
          mkdir -p /tmp/site-unpack
          unzip -q /tmp/site.zip -d /tmp/site-unpack

          test -f /tmp/site-unpack/the-glam-room/index.html

          find . -mindepth 1 -maxdepth 1 \
            ! -name '.git' \
            ! -name '.github' \
            ! -name '.glam-deploy' \
            -exec rm -rf {} +

          shopt -s dotglob
          cp -a /tmp/site-unpack/the-glam-room/. .
          shopt -u dotglob

          rm -rf .glam-deploy
          rm -f .github/workflows/build-glam-preview.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Deploy The Glam Room v2 preview"
          git push origin HEAD:the-glam-room-v2
